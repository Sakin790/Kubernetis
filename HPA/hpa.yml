apiVersion: autoscaling/v2               # v2 use করো — v1 outdated
kind: HorizontalPodAutoscaler
metadata:
  name: my-app-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: my-app                         # Deployment এর name match করতে হবে

  minReplicas: 2                         # সবসময় কমপক্ষে 2 pod চালু
  maxReplicas: 10                        # maximum এতটুকুই বাড়বে

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70         # CPU 70% হলে scale up শুরু

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80         # Memory 80% হলে scale up

  behavior:                              # scale কতটা দ্রুত হবে
    scaleUp:
      stabilizationWindowSeconds: 60     # 60s দেখার পর scale up করবে
      policies:
        - type: Pods
          value: 2                       # একবারে max 2 pod বাড়াবে
          periodSeconds: 60

    scaleDown:
      stabilizationWindowSeconds: 300    # 5 মিনিট stable থাকলে scale down
      policies:
        - type: Pods
          value: 1                       # একবারে ১টা কমাবে (হঠাৎ সব কমাবে না)
          periodSeconds: 60
